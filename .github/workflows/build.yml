name: Budowanie APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testy i budowanie APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee gradle.log

      # Błędy kompilacji/testów jako adnotacje (widoczne na stronie przebiegu bez pobierania logów)
      - name: Podsumowanie błędów
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|> .*Exception|expected:|AssertionError|Caused by" gradle.log \
            | grep -v "^\s*at " | head -60 > errors.txt || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -A3 "<failure" "$f" | head -20 >> errors.txt || true
          done
          MSG=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Błędy budowania::${MSG}"

      - name: Nazwa pliku
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="AiTrackerEye-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testy
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: AiTrackerEye-APK
          path: ${{ steps.apk.outputs.name }}

      # Najnowsze APK zawsze pod tym samym adresem:
      # https://github.com/<konto>/<repo>/releases/latest
      - name: Wydanie "najnowsza"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete najnowsza --cleanup-tag -y || true
          gh release create najnowsza "${{ steps.apk.outputs.name }}" \
            --title "AiTrackerEye ${{ steps.apk.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatyczna wersja z commita ${GITHUB_SHA::7}. Pobierz plik .apk na telefon/tablet i zainstaluj (zezwól na instalację z nieznanych źródeł)." \
            --target "$GITHUB_SHA" --latest
